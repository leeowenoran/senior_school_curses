" fill="#A3C96B" opacity="0.55" stroke="#A3C96B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#edge_bx1-u2-l3)"/><ellipse cx="942.7637822903692" cy="427.1065414806828" rx="7" ry="11" fill="#FBC02D" opacity="0.7" filter="url(#edge_bx1-u2-l3)"/><path d="M 942.7637822903692,436.1065414806828 q 4.526617375668138,-22 0,-30" fill="#A3C96B" opacity="0.55" stroke="#A3C96B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#edge_bx1-u2-l3)"/><ellipse cx="1102.3792760703714" cy="449.7921863168478" rx="7" ry="11" fill="#FBC02D" opacity="0.7" filter="url(#edge_bx1-u2-l3)"/><path d="M 1102.3792760703714,458.7921863168478 q -2.869932393077761,-22 0,-30" fill="#A3C96B" opacity="0.55" stroke="#A3C96B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#edge_bx1-u2-l3)"/><ellipse cx="1199.389706773311" cy="419.7533285262063" rx="7" ry="11" fill="#FBC02D" opacity="0.7" filter="url(#edge_bx1-u2-l3)"/><path d="M 1199.389706773311,428.7533285262063 q 1.3206046703271568,-22 0,-30" fill="#A3C96B" opacity="0.55" stroke="#A3C96B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#edge_bx1-u2-l3)"/>
