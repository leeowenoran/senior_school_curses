<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 875" width="1280" height="875">

<defs>
  <!-- paper grain -->
  <filter id="paper_bx1-u2-l2" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="4" result="noise"/>
    <feColorMatrix type="matrix" values="0.3 0 0 0 0.7  0 0.3 0 0 0.7  0 0 0.3 0 0.7  0 0 0 0.25 0" in="noise" result="grain"/>
    <feBlend mode="multiply" in="SourceGraphic" in2="grain"/>
  </filter>
  <!-- watercolor bloom edge -->
  <filter id="bloom_bx1-u2-l2" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="2.5"/>
  </filter>
  <!-- soft wash blur -->
  <filter id="wash_bx1-u2-l2" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <!-- distant mist -->
  <filter id="mist_bx1-u2-l2" x="0" y="0" width="100%" height="100%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <!-- hard watercolor (medium) -->
  <filter id="water_bx1-u2-l2" x="-15%" y="-15%" width="130%" height="130%">
    <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="1.2"/>
  </filter>
</defs>
<rect x="0" y="0" width="1280" height="875" fill="#FFF3E0" opacity="1" filter="url(#paper_bx1-u2-l2)"/><path d="M 0,875 L 320,481.25000000000006 L 960,481.25000000000006 L 1280,875 Z" fill="#D7CCC8" opacity="0.85" filter="url(#wash_bx1-u2-l2)"/><path d="M 230.39999999999998,481.25000000000006 L 1049.6,481.25000000000006 L 1088,717.5 L 192,717.5 Z" fill="#A1887F" opacity="0.9" filter="url(#water_bx1-u2-l2)"/><rect x="256" y="393.75" width="768" height="105" fill="#A1887F" opacity="0.7" filter="url(#water_bx1-u2-l2)"/><ellipse cx="640" cy="218.75" rx="180" ry="120" fill="#FFB74D" opacity="0.35" filter="url(#wash_bx1-u2-l2)"/><path d="M 486.4,367.5 l -22,-70 a 18,18 0 1 1 36,0 l -14,70 z" fill="#ECEFF1" opacity="0.9" filter="url(#bloom_bx1-u2-l2)"/><ellipse cx="486.4" cy="285.5" rx="22" ry="20" fill="#D7CCC8" opacity="0.95" filter="url(#bloom_bx1-u2-l2)"/><path d="M 832,420 l -18,-65 a 16,16 0 1 1 32,0 l -14,65 z" fill="#90A4AE" opacity="0.9" filter="url(#bloom_bx1-u2-l2)"/><ellipse cx="832" cy="344" rx="20" ry="18" fill="#D7CCC8" opacity="0.95" filter="url(#bloom_bx1-u2-l2)"/><ellipse cx="640" cy="131.25" rx="45" ry="55" fill="#E57373" opacity="0.85" filter="url(#water_bx1-u2-l2)"/><path d="M 636,76.25 L 644,76.25 L 640,61.25 Z" fill="#E57373" opacity="0.9"/><rect x="281.6" y="332.5" width="28" height="20" fill="#FFCC80" opacity="0.8" filter="url(#water_bx1-u2-l2)"/><rect x="326.6" y="332.5" width="28" height="20" fill="#FFAB91" opacity="0.8" filter="url(#water_bx1-u2-l2)"/><rect x="371.6" y="332.5" width="28" height="20" fill="#CE93D8" opacity="0.8" filter="url(#water_bx1-u2-l2)"/><rect x="416.6" y="332.5" width="28" height="20" fill="#90CAF9" opacity="0.8" filter="url(#water_bx1-u2-l2)"/><rect x="461.6" y="332.5" width="28" height="20" fill="#A5D6A7" opacity="0.8" filter="url(#water_bx1-u2-l2)"/><rect x="506.6" y="332.5" width="28" height="20" fill="#FFF59D" opacity="0.8" filter="url(#water_bx1-u2-l2)"/>
<rect x="0" y="542.5" width="1280" height="332.5" fill="url(#fade_bx1-u2-l2)" opacity="0.55"/><linearGradient id="fade_bx1-u2-l2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#3E2723" stop-opacity="0.7"/></linearGradient><text x="640" y="755" text-anchor="middle" font-family="'SimSun','Songti SC','Noto Serif SC',serif" font-size="58" font-weight="bold" fill="#FFFFFF" opacity="0.95" filter="url(#bloom_bx1-u2-l2)">心有一团火，温暖众人心</text><text x="640" y="837" text-anchor="middle" font-family="'KaiTi','STKaiti','Kaiti SC',serif" font-size="26" fill="#FFF8E1" opacity="0.9">林为民</text>
</svg>