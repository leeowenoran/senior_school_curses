<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 875" width="1280" height="875">

<defs>
  <!-- paper grain -->
  <filter id="paper_bx1-u2-l3" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="4" result="noise"/>
    <feColorMatrix type="matrix" values="0.3 0 0 0 0.7  0 0.3 0 0 0.7  0 0 0.3 0 0.7  0 0 0 0.25 0" in="noise" result="grain"/>
    <feBlend mode="multiply" in="SourceGraphic" in2="grain"/>
  </filter>
  <!-- watercolor bloom edge -->
  <filter id="bloom_bx1-u2-l3" x="-20%" y="-20%" width="140%" height="140%">
    <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="3" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="18" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="2.5"/>
  </filter>
  <!-- soft wash blur -->
  <filter id="wash_bx1-u2-l3" x="-10%" y="-10%" width="120%" height="120%">
    <feGaussianBlur stdDeviation="4"/>
  </filter>
  <!-- distant mist -->
  <filter id="mist_bx1-u2-l3" x="0" y="0" width="100%" height="100%">
    <feGaussianBlur stdDeviation="7"/>
  </filter>
  <!-- hard watercolor (medium) -->
  <filter id="water_bx1-u2-l3" x="-15%" y="-15%" width="130%" height="130%">
    <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="2" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="8" xChannelSelector="R" yChannelSelector="G"/>
    <feGaussianBlur stdDeviation="1.2"/>
  </filter>
</defs>
